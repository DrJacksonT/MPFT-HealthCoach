name: mpft-coach-local

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: mpft_coach
      POSTGRES_USER: mpft
      POSTGRES_PASSWORD: mpft-local-only
    ports:
      - "5432:5432"
    volumes:
      - mpft-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mpft -d mpft_coach"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27.8
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    restart: unless-stopped

volumes:
  mpft-postgres-data:
